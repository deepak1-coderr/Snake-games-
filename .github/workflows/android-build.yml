
name: Build Snake Game Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: pixel-snake-android/pixel-snake-android
        run: npm ci

      - name: Sync Capacitor Android
        working-directory: pixel-snake-android/pixel-snake-android
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version-file: pixel-snake-android/pixel-snake-android/android/gradle/wrapper/gradle-wrapper.properties

      - name: Build Android AAB
        run: gradle -p pixel-snake-android/pixel-snake-android/android bundleRelease

      - name: Upload AAB file
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Snake-AAB
          path: pixel-snake-android/pixel-snake-android/android/app/build/outputs/bundle/release/*.aab
